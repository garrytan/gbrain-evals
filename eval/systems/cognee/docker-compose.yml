# Cognee shim on a sealed network. The shim container has no route out: its only peers are `egress`, a TCP relay
# to the metering proxy, and `gateway`, which publishes the shim's port to the host. Real provider keys never enter
# the shim container; it holds a dummy key and the metering proxy injects the real one.
#
# Metered run:  PROXY_HOSTPORT=host.docker.internal:8787 SHIM_CONFIG=common docker compose up -d --build
# Keyless run:  PROXY_HOSTPORT=fake-provider:8787 docker compose --profile keyless up -d --build
#
# PROXY_HOSTPORT     where the metering proxy listens, as seen from the egress relay (default host.docker.internal:8787)
# PROXY_OPENAI_PATH  path prefix of the proxy's OpenAI-compatible routes (default /v1)
# SHIM_HOST_PORT     host port for the shim (default 8701, bound to 127.0.0.1)
name: shootout-cognee
services:
  cognee:
    build:
      context: ..
      dockerfile: cognee/Dockerfile
    image: shootout-cognee:dev
    environment:
      SHIM_CONFIG: ${SHIM_CONFIG:-recipe}
      OPENAI_BASE_URL: http://egress:8787${PROXY_OPENAI_PATH:-/v1}
      OPENAI_API_KEY: dummy-key-the-proxy-injects-the-real-one
      LLM_ENDPOINT: http://egress:8787${PROXY_OPENAI_PATH:-/v1}
      LLM_API_KEY: dummy-key-the-proxy-injects-the-real-one
      EMBEDDING_ENDPOINT: http://egress:8787${PROXY_OPENAI_PATH:-/v1}
      EMBEDDING_API_KEY: dummy-key-the-proxy-injects-the-real-one
    volumes:
      - cognee-data:/data
    mem_limit: ${SHIM_MEM_LIMIT:-6g}
    networks: [sealed]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8700/health', timeout=5)"]
      interval: 5s
      retries: 60

  egress:
    image: alpine/socat:1.8.0.3@sha256:beb4a68d9e4fe6b0f21ea774a0fde6c31f580dde6368939ed70100c5385b015e
    command: TCP-LISTEN:8787,fork,reuseaddr TCP:${PROXY_HOSTPORT:-host.docker.internal:8787}
    extra_hosts: ["host.docker.internal:host-gateway"]
    networks: [sealed, outside]

  gateway:
    image: alpine/socat:1.8.0.3@sha256:beb4a68d9e4fe6b0f21ea774a0fde6c31f580dde6368939ed70100c5385b015e
    command: TCP-LISTEN:8700,fork,reuseaddr TCP:cognee:8700
    ports: ["127.0.0.1:${SHIM_HOST_PORT:-8701}:8700"]
    networks: [sealed, outside]

  fake-provider:
    profiles: [keyless]
    image: python:3.12-slim@sha256:02108f5d322dd89f1c9e552442c25acb0543dfdbc455693a5599624f20d9155d
    command: python /tests/fake_provider.py
    environment:
      FAKE_PROVIDER_LOG: /tests/out/fake_provider_requests.jsonl
    volumes:
      - ./tests:/tests
    ports: ["127.0.0.1:${FAKE_PROVIDER_HOST_PORT:-8788}:8787"]
    networks: [outside]

volumes:
  cognee-data:

networks:
  sealed:
    internal: true
  outside: {}
