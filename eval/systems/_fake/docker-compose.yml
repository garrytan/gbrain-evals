# Keyless reference stack: the in-repo fake shim on an internal network, laid out like the vendor stacks (an egress
# relay to the metering proxy, an ingress relay publishing the shim). It proves bootstrap.sh and a cell's plumbing
# on a VM without any vendor image. Its scores say nothing about memory quality.
#
#   bash eval/systems/bootstrap.sh up --system _fake      (the shim on 127.0.0.1:${SHIM_HOST_PORT:-8700})
#
# The shim keeps its store on the fake-data volume (SHIM_STATE_FILE), so `bootstrap.sh restart` keeps state the way a
# vendor stack's volumes do, `snapshot` and `restore` carry it, and `down` removes it.
name: shootout-fake

services:
  shim:
    image: python:3.12-slim@sha256:02108f5d322dd89f1c9e552442c25acb0543dfdbc455693a5599624f20d9155d
    command: ["python", "/app/_fake/fake.py"]
    environment:
      SHIM_CONFIG: ${SHIM_CONFIG:-recipe}
      SHIM_PORT: "8700"
      SHIM_STATE_FILE: /data/fake-state.json
      OPENAI_API_KEY: ${SHOOTOUT_CELL_TOKEN:-sk-dummy-metering-proxy-injects-the-real-key}
      OPENAI_BASE_URL: http://egress:8787/fake/openai/v1
    volumes:
      - ../_shim:/app/_shim:ro
      - ../_fake:/app/_fake:ro
      - fake-data:/data
    networks: [sandbox]

  egress:
    image: alpine/socat:1.8.0.3@sha256:beb4a68d9e4fe6b0f21ea774a0fde6c31f580dde6368939ed70100c5385b015e
    command: ["TCP-LISTEN:8787,fork,reuseaddr", "TCP:${PROXY_UPSTREAM:-host.docker.internal:8787}"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    networks: [sandbox, egress]

  ingress:
    image: alpine/socat:1.8.0.3@sha256:beb4a68d9e4fe6b0f21ea774a0fde6c31f580dde6368939ed70100c5385b015e
    command: ["TCP-LISTEN:8700,fork,reuseaddr", "TCP:shim:8700"]
    ports: ["127.0.0.1:${SHIM_HOST_PORT:-8700}:8700"]
    networks: [sandbox, egress]

volumes:
  fake-data: {}

networks:
  sandbox:
    internal: true
  egress: {}
