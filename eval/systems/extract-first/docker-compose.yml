# extract-first OSS shim and Qdrant on an internal network. The only container with a route out is `proxy`, a TCP relay to the
# metering proxy (PROXY_UPSTREAM, on the VM host by default). The shim holds a dummy key; the proxy injects the real one.
#
#   docker compose -f eval/systems/extract-first/docker-compose.yml up -d --build
#   SHIM_CONFIG=common MEM0_CHUNK_TURNS=1 docker compose -f eval/systems/extract-first/docker-compose.yml up -d
# MEM0_CHUNK_TURNS follows extract-first's benchmark code: 1 for LoCoMo, 2 for LongMemEval and BEAM (the default).
# The harness reaches the shim at 127.0.0.1:${SHIM_HOST_PORT:-8702}.
name: shootout-extract-first

services:
  shim:
    build:
      context: ..
      dockerfile: extract-first/Dockerfile
    image: shootout/extract-first:2.2.1
    depends_on:
      qdrant:
        condition: service_healthy
    environment:
      SHIM_CONFIG: ${SHIM_CONFIG:-recipe}
      SHIM_IMAGE: ${SHIM_IMAGE:-}
      MEM0_CHUNK_TURNS: ${MEM0_CHUNK_TURNS:-2}
      OPENAI_API_KEY: sk-dummy-metering-proxy-injects-the-real-key
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-${PROXY_URL:-http://proxy:8787}/${PROXY_SLOT:-extract-first}/openai/v1}
    volumes:
      - data:/data
    networks: [sandbox]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,json,sys; sys.exit(0 if json.load(urllib.request.urlopen('http://127.0.0.1:8700/health'))['ok'] else 1)"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 20s

  qdrant:
    image: qdrant/qdrant:v1.19.2@sha256:b7b0444c4c351c970b98e90a6f89c2ee4287c65b44e52b4cb503fa5b2aa927ad
    environment:
      QDRANT__TELEMETRY_DISABLED: "true"
    volumes:
      - qdrant:/qdrant/storage
    networks: [sandbox]
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 3s
      retries: 20

  proxy:
    image: alpine/socat:1.8.0.3@sha256:beb4a68d9e4fe6b0f21ea774a0fde6c31f580dde6368939ed70100c5385b015e
    command: ["TCP-LISTEN:8787,fork,reuseaddr", "TCP:${PROXY_UPSTREAM:-host.docker.internal:8787}"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    networks: [sandbox, egress]

  # Publishes the shim's port to the host without giving the shim itself a route out.
  ingress:
    image: alpine/socat:1.8.0.3@sha256:beb4a68d9e4fe6b0f21ea774a0fde6c31f580dde6368939ed70100c5385b015e
    command: ["TCP-LISTEN:8700,fork,reuseaddr", "TCP:shim:8700"]
    ports: ["127.0.0.1:${SHIM_HOST_PORT:-8702}:8700"]
    networks: [sandbox, egress]

networks:
  sandbox:
    internal: true
  egress: {}

volumes:
  data: {}
  qdrant: {}
