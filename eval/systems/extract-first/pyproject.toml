[project]
name = "shootout-mem0-shim"
version = "0.0.0"
requires-python = "==3.12.*"
# mem0's documented install for hybrid search: mem0ai[nlp] plus the spaCy English model, and fastembed so the
# Qdrant backend can encode BM25 sparse vectors (docs/migration/oss-v2-to-v3.mdx at tag v2.2.1).
dependencies = [
    "mem0ai[nlp]==2.2.1",
    "fastembed",
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
]

[tool.uv]
package = false
prerelease = "if-necessary"
exclude-newer = "2026-10-05T00:00:00Z"
