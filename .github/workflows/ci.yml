# Hermetic CI gate (WS10, BrainBench v0.5.0).
#
# Zero secrets by design: everything here runs keyless. API-dependent
# benchmarks (LongMemEval embeds, judge-based cats) run manually and land
# receipts — see TODOS.md P1 and eval/RUNBOOK.md. Actions are pinned to
# commit SHAs; bun is pinned to the version in package.json engines;
# installs are frozen-lockfile. Per-job timeout enforces the <10 min budget
# rather than hoping for it.
name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  hermetic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.10

      # Installs gbrain from the pinned SHA in package.json — this is the
      # packaged-install proof (no bun link anywhere in CI).
      - name: Install (frozen lockfile)
        run: bun install --frozen-lockfile

      # gbrain ships raw .ts sources with its own loose internal typings;
      # our gate is the REPO's files. Fails on any non-node_modules error.
      - name: Typecheck (repo files)
        run: |
          bunx tsc --noEmit 2>&1 | tee /tmp/tsc.log && tsc_status=0 || tsc_status=$?
          if grep -v node_modules /tmp/tsc.log | grep -q 'error TS'; then
            grep -v node_modules /tmp/tsc.log | grep 'error TS'
            exit 1
          fi
          # A tsc crash that prints no 'error TS' line must not pass silently
          # (issue #24 finding 8a — the old `|| true` swallowed it).
          if [ "${tsc_status:-0}" -ne 0 ] && ! grep -q 'error TS' /tmp/tsc.log; then
            echo "tsc exited ${tsc_status} without reporting TS errors (crash?)"
            exit 1
          fi

      # scripts/ has its own target (different runtime assumptions than
      # eval/ + test/; keeping it out of the main include avoids dumping an
      # unrelated backlog into that gate — outside-voice round 2).
      - name: Typecheck (scripts)
        run: |
          bunx tsc --noEmit -p tsconfig.scripts.json 2>&1 | tee /tmp/tsc-scripts.log && tsc_status=0 || tsc_status=$?
          if grep -v node_modules /tmp/tsc-scripts.log | grep -q 'error TS'; then
            grep -v node_modules /tmp/tsc-scripts.log | grep 'error TS'
            exit 1
          fi
          if [ "${tsc_status:-0}" -ne 0 ] && ! grep -q 'error TS' /tmp/tsc-scripts.log; then
            echo "tsc exited ${tsc_status} without reporting TS errors (crash?)"
            exit 1
          fi

      - name: Unit + integration tests
        run: bun test test/eval/

      # Outside-verification gate (issue #26), next to the manifest gate the
      # unit suite runs: every cited artifact is committed or disclosed,
      # retired figures stay retired and qualified ones qualified, alias-
      # judged receipts carry server-reported model ids, package/lock/action
      # pins agree, and gbrain's Cat 34 baseline at the pin reproduces the
      # committed receipt digit-for-digit. Keyless; exit 2 = could not run.
      - name: Outside-verification gate (receipts, claims, pins)
        run: bun eval/verify/all.ts --quiet

      - name: Data referential integrity
        run: bun eval/runner/validate-data.ts

      - name: Retrieval regression gate (qrels + baseline, keyword-only)
        run: bun scripts/generate-v0.41-launch.ts --check

      # Hermetic runner subset — each is a REAL end-to-end run (PGLite,
      # extraction, ranking) needing no API keys. Individually bounded so
      # one hang can't eat the job budget.
      - name: "Runner: adversarial (Cat 10)"
        run: timeout 180 bun eval/runner/adversarial.ts
      - name: "Runner: type-accuracy (Cat 2)"
        run: timeout 240 bun eval/runner/type-accuracy.ts
      - name: "Runner: temporal (Cat 4)"
        run: timeout 240 bun eval/runner/temporal.ts
      - name: "Runner: identity (Cat 3)"
        run: timeout 180 bun eval/runner/identity.ts
      - name: "Runner: before-after (Cat 1)"
        run: timeout 300 bun eval/runner/before-after.ts
      - name: "Runner: mcp-contract (Cat 12)"
        run: timeout 300 bun eval/runner/mcp-contract.ts
      - name: "Runner: cat6 prose-scale (Cat 6)"
        run: timeout 300 bun eval/runner/cat6-prose-scale.ts

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: eval-reports
          path: |
            eval/reports/
            /tmp/tsc.log
          if-no-files-found: ignore
          retention-days: 14
