# Hermetic CI gate (WS10, BrainBench v0.5.0).
#
# Zero secrets by design: everything here runs keyless. API-dependent
# benchmarks (LongMemEval embeds, judge-based cats) run manually and land
# receipts; see TODOS.md and eval/RUNBOOK.md. Actions are pinned to commit
# SHAs; bun is pinned by `bun-version` below; installs are frozen-lockfile.
# The unit suite is split across two shard jobs, each running its files in
# parallel workers against a shared pre-migrated PGLite snapshot
# (test/support/pglite-snapshot.ts). Per-job timeouts bound every job well
# above its observed runtime rather than hoping for it.
name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      # Installs gbrain from the pinned SHA in package.json: the
      # packaged-install proof (no bun link anywhere in CI).
      - name: Install (frozen lockfile)
        run: bun install --frozen-lockfile

      # Unfiltered: dependency sources are type-checked too. Ambient shims
      # for Bun text imports and untyped modules live in types/.
      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Typecheck (scripts)
        run: bunx tsc --noEmit -p tsconfig.scripts.json

      - name: Python harness tests
        run: python3 test/retrieval_refresh_orchestrator_test.py

      - name: Validators (published LongMemEval recount, documentation, queries, data)
        run: bun run validate

      - name: Retrieval regression gate (qrels + baseline, keyword-only)
        run: bun scripts/generate-v0.41-launch.ts --check

      # Hermetic runner subset: each is a REAL end-to-end run (PGLite,
      # extraction, ranking) needing no API keys. Individually bounded so
      # one hang can't eat the job budget. Every step fails on the runner's
      # own nonzero exit code, the same signal all.ts falls back to, so a
      # score gate added inside a runner (Cat 2 and Cat 3 have none yet)
      # fails CI without further workflow changes.
      - name: "Runner: adversarial (Cat 10)"
        run: timeout 180 bun eval/runner/adversarial.ts
      - name: "Runner: type-accuracy (Cat 2)"
        run: timeout 240 bun eval/runner/type-accuracy.ts
      - name: "Runner: temporal (Cat 4)"
        run: timeout 240 bun eval/runner/temporal.ts
      - name: "Runner: identity (Cat 3)"
        run: timeout 180 bun eval/runner/identity.ts
      - name: "Runner: before-after (Cat 1)"
        run: timeout 300 bun eval/runner/before-after.ts
      - name: "Runner: mcp-contract (Cat 12)"
        run: timeout 300 bun eval/runner/mcp-contract.ts
      - name: "Runner: cat6 prose-scale (Cat 6)"
        run: timeout 300 bun eval/runner/cat6-prose-scale.ts
      - name: "Runner: Cat36 offline plumbing (not capability evidence)"
        run: timeout 180 bun eval/runner/cat36-associative-retrieval.ts --offline --smoke

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: eval-reports
          path: eval/reports/
          if-no-files-found: ignore
          retention-days: 14

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install (frozen lockfile)
        run: bun install --frozen-lockfile

      # test/eval/ plus the unit tests colocated under eval/.
      - name: Unit + integration tests (shard ${{ matrix.shard }}/2)
        run: bun test --parallel --shard=${{ matrix.shard }}/2 test/eval/ eval/
