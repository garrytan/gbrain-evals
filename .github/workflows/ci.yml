# Hermetic CI gate (WS10, BrainBench v0.5.0).
#
# Zero secrets by design: everything here runs keyless. API-dependent
# benchmarks (LongMemEval embeds, judge-based cats) run manually and land
# receipts; see TODOS.md and eval/RUNBOOK.md. Actions are pinned to commit
# SHAs; bun is pinned by `bun-version` below; installs are frozen-lockfile.
# The unit suite is split across four shard jobs (ordinary `bun test
# --shard`, not the experimental parallel worker mode), all loading a
# shared pre-migrated PGLite snapshot (test/support/pglite-snapshot.ts).
# Per-job timeouts bound every job well above its observed runtime rather
# than hoping for it.
name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # One copy of the repository's git objects for every job (GST-1253). The tip
  # tree is about 1.3 GB packed, nearly all of it receipts under docs/benchmarks/,
  # and every job used to fetch it from GitHub. From 2026-11-03 GitHub served
  # those packs slowly enough that 5- and 15-minute jobs ran out of time inside
  # actions/checkout. This job keeps the whole .git (every branch, full history)
  # in the Actions cache: a push to main refreshes it for the new commit, and a
  # pull request builds one only when neither the PR nor main has one yet. Every
  # other job restores it before actions/checkout, which then fetches only what
  # is new and checks out the same commit at the same depth as before. A depth-1
  # job's .git now also holds older commits' objects, so tests that look for a
  # pinned commit (five cases in test/eval/q1-reuse-check.test.ts) run instead of
  # skipping; without a cache they skip, as before. The save follows a checkout
  # with persist-credentials: false and refuses a stored credential. Every job
  # that runs a check runs even when this one fails, checking out from GitHub as
  # before, so a broken cache never turns a check into a skipped one. The run
  # still fails on git-cache until a rerun rebuilds the cache, and tested-tree,
  # which runs no tests, keeps its default condition, which reads every upstream
  # job, so it is skipped and that run carries nothing.
  git-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - id: cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .git
          key: ${{ format('git-objects-v1-{0}', github.sha) }}
          restore-keys: git-objects-v1-
          lookup-only: ${{ github.event_name != 'push' }}

      - if: steps.cache.outputs.cache-hit != 'true' && (github.event_name == 'push' || steps.cache.outputs.cache-matched-key == '')
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - if: steps.cache.outputs.cache-hit != 'true' && (github.event_name == 'push' || steps.cache.outputs.cache-matched-key == '')
        name: Refuse to cache a stored credential
        run: test -z "$(git config --local --get-regexp 'extraheader')$(git config --local --get-regexp '^includeif\.')"

      - if: steps.cache.outputs.cache-hit != 'true' && (github.event_name == 'push' || steps.cache.outputs.cache-matched-key == '')
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .git
          key: ${{ format('git-objects-v1-{0}', github.sha) }}

  checks:
    needs: git-cache
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .git
          key: ${{ format('git-objects-v1-{0}', github.sha) }}
          restore-keys: git-objects-v1-

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4

      # Installs gbrain from the pinned SHA in package.json: the
      # packaged-install proof (no bun link anywhere in CI).
      - name: Install (frozen lockfile)
        run: bun install --frozen-lockfile

      # Unfiltered: dependency sources are type-checked too. Ambient shims
      # for Bun text imports and untyped modules live in types/. The program
      # needs about 4.4 GB of heap, past node's default 4 GB limit, so the
      # package.json `typecheck` script raises the limit itself; the runner
      # has 16 GB. CI runs that script, the same command every machine runs,
      # and then the scripts/ program.
      - name: Typecheck
        run: bun run typecheck

      - name: Python harness tests
        run: python3 test/retrieval_refresh_orchestrator_test.py

      - name: Validators (published LongMemEval recount, documentation, links, queries, data)
        run: bun run validate

      - name: Retrieval regression gate (qrels + baseline, keyword-only)
        run: bun scripts/generate-v0.41-launch.ts --check

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: eval-reports
          path: eval/reports/
          if-no-files-found: ignore
          retention-days: 14

  # Every keyless category through all.ts (--tier offline), in three shards
  # balanced by measured seconds (eval/runner/brainbench-shard-weights.json).
  # One job took about 800 s of its 900 s bound on 2026-10-23 runners; each
  # shard keeps that bound and writes its share of it to the job summary.
  # Status comes from each runner's receipt and gate (Cats 1, 2, 3 and 10 gate
  # on regressions), so a score regression fails the shard through all.ts's
  # exit code. The N1 and N5 CI slices (knowledge-update-ci,
  # forget-residue-ci) run on PGLite through the gbrain CLI. Cat 34 needs an
  # external gbrain checkout and records a skip; BRAINBENCH_ALLOW_SKIP
  # acknowledges receipt-declared skips.
  brainbench:
    needs: git-cache
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .git
          key: ${{ format('git-objects-v1-{0}', github.sha) }}
          restore-keys: git-objects-v1-

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4

      - name: Install (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: "BrainBench offline tier, shard ${{ matrix.shard }}/3 (all.ts --tier offline)"
        run: BRAINBENCH_ALLOW_SKIP=1 BRAINBENCH_BOUND_S=900 timeout 900 bun run eval:brainbench --shard ${{ matrix.shard }}/3

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: eval-reports-brainbench-${{ matrix.shard }}
          path: eval/reports/
          if-no-files-found: ignore
          retention-days: 14

  prereg-order:
    needs: git-cache
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .git
          key: ${{ format('git-objects-v1-{0}', github.sha) }}
          restore-keys: git-objects-v1-

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4

      # Every experiment listed in docs/benchmarks/preregistrations.json must
      # have its preregistration committed before any of its result files.
      - name: Preregistration order
        run: bun eval/runner/prereg.ts

  tests:
    needs: git-cache
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .git
          key: ${{ format('git-objects-v1-{0}', github.sha) }}
          restore-keys: git-objects-v1-

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4

      - name: Install (frozen lockfile)
        run: bun install --frozen-lockfile

      # The file-agent baseline's grep runs ripgrep (eval/runner/systems/file-agent.ts).
      - name: Install ripgrep
        run: sudo apt-get update -q && sudo apt-get install -y ripgrep

      # test/eval/ plus the unit tests colocated under eval/. The JUnit report
      # names the files this shard ran, for the tested-tree job below.
      - name: Unit + integration tests (shard ${{ matrix.shard }}/4)
        run: bun test --shard=${{ matrix.shard }}/4 test/eval/ eval/ --reporter=junit --reporter-outfile="$RUNNER_TEMP/tests-${{ matrix.shard }}.xml"

      - name: Upload the files this shard ran
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tested-files-${{ matrix.shard }}
          path: ${{ runner.temp }}/tests-${{ matrix.shard }}.xml
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  # The tested tree for gstack's CI carry (gstack docs/pregate.md#ci-carry).
  # After the checks job and all four test shards pass, tree.json records this
  # run, the tree it tested and every test file it ran: the Bun files from the
  # shards' JUnit reports and the Python tests the checks job runs. gstack's
  # pregate and /ship read it from a green run at the same clean tree
  # (.gstack/pregate.json run_profiles and ship_lanes_from) instead of running
  # the suite again. It runs no tests itself.
  tested-tree:
    needs: [checks, tests]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .git
          key: ${{ format('git-objects-v1-{0}', github.sha) }}
          restore-keys: git-objects-v1-

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: tested-files-*
          merge-multiple: true
          path: ${{ runner.temp }}/tested-files

      - name: Record the tested tree
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bun scripts/ci-tested-tree.ts record --junit "$RUNNER_TEMP/tested-files" --out "$RUNNER_TEMP/tested-tree/tree.json"

      - name: Upload the tested tree
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tested-tree
          path: ${{ runner.temp }}/tested-tree/tree.json
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  # The head-to-head scoreboard's $0 fixture (docs/scoreboard.md): the reference
  # fake system end to end through the shim, the metering proxy in lease mode,
  # the native packer, a keyless fake provider as reader and judge, the shared
  # answer records, cost and speed, and the generator's render and check on the
  # synthetic receipt. No keys, no Docker. judge-repeat stays stubbed: its `run`
  # is a paid, ledger-reserved judge with no keyless fixture provider yet.
  # Wiring the fixture through it is gbrain-evals issue #195.
  scoreboard:
    needs: git-cache
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .git
          key: ${{ format('git-objects-v1-{0}', github.sha) }}
          restore-keys: git-objects-v1-

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4

      - name: Install (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Scoreboard fixture ($0)
        run: timeout 300 bun run eval:scoreboard fixture --stub judge-repeat --json

  # Secret scan of published receipts: every receipts/ directory and every
  # scoreboard receipt tree under docs/benchmarks/, plus the members of every
  # tarball or gzip receipt under docs/benchmarks, results, baselines and qrels
  # that is not reviewed at its current hash and gitleaks version in
  # test/eval/fixtures/reviewed-compressed-receipts.json; a tarball GNU tar
  # cannot list cleanly, or one with a repeated name or a special entry, is
  # refused unread. gitleaks is pinned by version and sha256; findings are
  # redacted in the log.
  receipt-secrets:
    needs: git-cache
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .git
          key: ${{ format('git-objects-v1-{0}', github.sha) }}
          restore-keys: git-objects-v1-

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: gitleaks on docs/benchmarks/**/receipts, scoreboard receipts and compressed receipts
        run: bash scripts/scan-receipts.sh

  # The pinned agent-memory benchmark harness (eval/harness-provider/): CPU-only
  # install, the Python wrapper tests (scorer conformance, projection and leak
  # checks, gbrain provider isolation), the metering proxy's per-process
  # zero-balance tests and the keyless launcher fixture. Everything talks to
  # local stubs; no secrets. MPW_REQUIRE_HARNESS=1 turns a missing venv into a
  # failure instead of a skip. The Python tests (about 6 minutes) and the Bun
  # proxy and launcher tests (about 2.5 minutes) need the same venv but nothing
  # from each other, so they run as two jobs side by side instead of in series,
  # each installing the venv itself; the test files are unchanged.
  harness:
    needs: git-cache
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite: [pytest, proxy]
    env:
      MPW_REQUIRE_HARNESS: '1'
    steps:
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .git
          key: ${{ format('git-objects-v1-{0}', github.sha) }}
          restore-keys: git-objects-v1-

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4

      - name: Install uv 0.12.3
        run: pipx install uv==0.12.3

      - name: Install (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Install the pinned harness (CPU wheels)
        run: bun run harness:setup

      - name: Harness wrapper tests (pytest)
        if: matrix.suite == 'pytest'
        run: bun run harness:test

      - name: Metering proxy and launcher tests
        if: matrix.suite == 'proxy'
        run: bun test test/eval/harness-metering-proxy.test.ts test/eval/harness-cell.test.ts test/eval/harness-cell-e2e.test.ts
