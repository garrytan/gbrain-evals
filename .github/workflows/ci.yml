# Hermetic CI gate (WS10, BrainBench v0.5.0).
#
# Zero secrets by design: everything here runs keyless. API-dependent
# benchmarks (LongMemEval embeds, judge-based cats) run manually and land
# receipts; see TODOS.md and eval/RUNBOOK.md. Actions are pinned to commit
# SHAs; bun is pinned by `bun-version` below; installs are frozen-lockfile.
# The unit suite is split across four shard jobs (ordinary `bun test
# --shard`, not the experimental parallel worker mode), all loading a
# shared pre-migrated PGLite snapshot (test/support/pglite-snapshot.ts).
# Per-job timeouts bound every job well above its observed runtime rather
# than hoping for it.
name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      # Installs gbrain from the pinned SHA in package.json: the
      # packaged-install proof (no bun link anywhere in CI).
      - name: Install (frozen lockfile)
        run: bun install --frozen-lockfile

      # Unfiltered: dependency sources are type-checked too. Ambient shims
      # for Bun text imports and untyped modules live in types/.
      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Typecheck (scripts)
        run: bunx tsc --noEmit -p tsconfig.scripts.json

      - name: Python harness tests
        run: python3 test/retrieval_refresh_orchestrator_test.py

      - name: Validators (published LongMemEval recount, documentation, links, queries, data)
        run: bun run validate

      - name: Retrieval regression gate (qrels + baseline, keyword-only)
        run: bun scripts/generate-v0.41-launch.ts --check

      # Every keyless category through all.ts (--tier offline). Status comes
      # from each runner's receipt and gate (Cats 1, 2, 3 and 10 gate on
      # regressions), so a score regression fails this step through all.ts's
      # exit code. The N1 and N5 CI slices (knowledge-update-ci,
      # forget-residue-ci) run here on PGLite through the gbrain CLI. Cat 34 needs an external gbrain checkout and records a
      # skip here; BRAINBENCH_ALLOW_SKIP acknowledges receipt-declared skips.
      - name: "BrainBench offline tier (all.ts --tier offline)"
        run: BRAINBENCH_ALLOW_SKIP=1 timeout 900 bun run eval:brainbench

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: eval-reports
          path: eval/reports/
          if-no-files-found: ignore
          retention-days: 14

  prereg-order:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      # Every experiment listed in docs/benchmarks/preregistrations.json must
      # have its preregistration committed before any of its result files.
      - name: Preregistration order
        run: bun eval/runner/prereg.ts

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Install (frozen lockfile)
        run: bun install --frozen-lockfile

      # test/eval/ plus the unit tests colocated under eval/.
      - name: Unit + integration tests (shard ${{ matrix.shard }}/4)
        run: bun test --shard=${{ matrix.shard }}/4 test/eval/ eval/

  # The pinned agent-memory benchmark harness (eval/harness-provider/): CPU-only
  # install, the Python wrapper tests (scorer conformance, projection and leak
  # checks, gbrain provider isolation), the metering proxy's per-process
  # zero-balance tests and the keyless launcher fixture. Everything talks to
  # local stubs; no secrets. MPW_REQUIRE_HARNESS=1 turns a missing venv into a
  # failure instead of a skip.
  harness:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MPW_REQUIRE_HARNESS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Install uv 0.12.3
        run: pipx install uv==0.12.3

      - name: Install (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Install the pinned harness (CPU wheels)
        run: bun run harness:setup

      - name: Harness wrapper tests (pytest)
        run: bun run harness:test

      - name: Metering proxy and launcher tests
        run: bun test test/eval/harness-metering-proxy.test.ts test/eval/harness-cell.test.ts test/eval/harness-cell-e2e.test.ts
