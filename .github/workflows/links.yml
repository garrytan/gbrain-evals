# Weekly external link check (docs audit B12). Local links and heading
# anchors are checked on every push by `bun run validate` in ci.yml; this job
# also fetches every external link. Hosts that refuse automated clients
# (HTTP 401, 403, 429) are reported as warnings, not failures.
name: links

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

jobs:
  external-links:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check local and external Markdown links
        run: python3 scripts/check-links.py --external
