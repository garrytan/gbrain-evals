<script type="application/json" id="packet-data" data-sha="20210a0610461a138f9b7ce2013ef273b9af4a01ff3cb55a5bf136f7086cacdc">{"packet":"chronicle","title":"auto_chronicle reference labels","rules":["Expected events are anchor events: the meeting or sync itself on the page's date; each bullet under a Decisions heading, dated the page's date; and a past occurrence the page dates to a specific day (\"yesterday's meeting\").","Not expected (neither required nor wrong when correctly dated): action items and commitments made at the meeting, dated the meeting day; confirmations and statements made at the meeting.","Never expected: anything dated after the page's own date (planned follow-ups, deadlines, scheduled board meetings), and past occurrences the page dates only to a month or quarter.","An extracted event matches an expected event of the same page when its day equals the expected day and its summary contains one of the keywords (case-insensitive); matching is a maximum bipartite matching per page."],"timezone":"UTC (gbrain's default chronicle.tz); a calendar invite's day is its DTSTART day in UTC","label_files":{"eval/data/chronicle-lift-v1/gold-events.json":"694ce35d9cc6f34fc98ba593afdcbcdaccdeef8ba3d9893bdce544a2c3e608ae"},"cards":[{"slug":"meetings/mtg-0000","class":"meeting","page_date":"2026-04-14","content":"---\nid: mtg-0000\ndate: 2026-04-14\nattendees: [user/amara-okafor, people/elena-rossi]\nsource: circleback\n---\n# Portfolio Review: Meridian Robotics Q1 Performance\n\n[Amara Okafor](people/amara-okafor) and [Elena Rossi](people/elena-rossi) connected to discuss [Meridian Robotics](companies/meridian-robotics) Q1 2026 results and upcoming Series B considerations.\n\n## Key Discussion Points\n\n**Q1 Performance Overview**\n\n[Elena](people/elena-rossi) reported that [Meridian](companies/meridian-robotics) closed Q1 with $2.1M ARR, up 34% from Q4 2025. Customer retention remains strong at 94%, though the sales cycle has lengthened due to enterprise procurement slowdowns. The warehouse automation vertical is performing above expectations, while manufacturing has been slower to convert.\n\n[Amara](people/amara-okafor) asked about the CAC payback period, which [Elena](people/elena-rossi) confirmed has improved to 14 months from 18 months last quarter. She attributed this to the new channel partnership with [Thornfield Industrial](companies/thornfield-industrial).\n\n**Series B Timing**\n\n[Amara](people/amara-okafor) raised the question of Series B timing. Current runway extends to Q1 2027, but both agreed that starting conversations in Q3 2026 would be prudent given market conditions. [Elena](people/elena-rossi) mentioned she's had inbound interest from [Northvane Partners](companies/northvane-partners) and one other growth fund she declined to name.\n\n[Amara](people/amara-okafor) offered to make introductions to [Marcus Reid](people/marcus-reid) at [Arcline Ventures](companies/arcline-ventures), who has been actively looking at industrial automation.\n\n**Team \u0026 Hiring**\n\nEngineering headcount is at 23, with plans to hire 4 more by end of Q2. [Elena](people/elena-rossi) flagged that the VP Engineering search is taking longer than expected and asked if [Amara](people/amara-okafor) had candidates in her network.\n\n## Action Items\n\n- [ ] [Amara](people/amara-okafor) to send intro email to [Marcus Reid](people/marcus-reid) by Friday\n- [ ] [Elena](people/elena-rossi) to share updated investor deck draft by April 21\n- [ ] [Amara](people/amara-okafor) to pull VP Eng candidates from [Halfway Capital](companies/halfway-capital) talent network\n- [ ] Schedule follow-up for early May to review Series B strategy","time":null,"events":[{"id":"m0-meeting","day":"2026-04-14","kind":"meeting","keywords":["Elena","Meridian"],"basis":"the portfolio review meeting itself, dated by frontmatter"}]},{"slug":"meetings/mtg-0001","class":"meeting","page_date":"2026-04-14","content":"---\nid: mtg-0001\ndate: 2026-04-14\nattendees: [user/amara-okafor, people/priya-patel]\nsource: granola\nlinked_calendar: cal/evt-0001\n---\n# Catch-up with Priya Patel - NovaBio Series B Discussion\n\nQuick coffee sync with [Priya](people/priya-patel) to discuss the [NovaBio](companies/novabio) situation and get her read on the founding team dynamics before we go deeper on diligence.\n\n## Key Discussion Points\n\nPriya gave me the rundown on her time advising NovaBio back in 2024. She's still close with the team and had good insights on the cap table structure. Mentioned that [Jordan Park](people/jordan-park) holds 17% equity after the Series A dilution, which she thinks is healthy for a technical co-founder at this stage. Jordan's been the driving force behind the synthetic biology platform and Priya says the IP is legitimately differentiated.\n\nWe talked through some of the interpersonal dynamics. Priya flagged that [Marcus Reid](people/marcus-reid) and Jordan had some tension around go-to-market timing last year, but says they've worked through it. She thinks Marcus has grown a lot as a CEO.\n\nPriya also mentioned she's been talking to [Sarah Chen](people/sarah-chen) about potentially joining NovaBio's board if the Series B comes together. Could be a good signal for us.\n\n## Concerns Raised\n\n- Burn rate is higher than I'd expect for a 30-person team\n- Regulatory pathway still has some question marks\n- Need to understand the exclusivity terms with their manufacturing partner\n\n## Action Items\n\n- [ ] Amara to schedule technical deep-dive with Jordan Park\n- [ ] Request updated cap table from NovaBio\n- [ ] Priya to intro Amara to Sarah Chen for board perspective\n- [ ] Pull together comparable Series B terms from recent synthetic bio deals\n\nPriya offered to make a warm intro to Jordan directly. Said she'd text him today.","time":null,"events":[{"id":"m1-meeting","day":"2026-04-14","kind":"meeting","keywords":["Priya","NovaBio"],"basis":"the catch-up meeting itself"}]},{"slug":"meetings/mtg-0002","class":"meeting","page_date":"2026-04-15","content":"---\nid: mtg-0002\ndate: 2026-04-15\nattendees: [user/amara-okafor, people/diego-alvarez]\nsource: circleback\nlinked_calendar: cal/evt-0004\n---\n# Threshold Robotics Series B Planning Call\n\n[Amara Okafor](user/amara-okafor) and [Diego Alvarez](people/diego-alvarez) connected to discuss the upcoming [Threshold Robotics](companies/threshold-robotics) Series B raise and Halfway Capital's positioning.\n\n## Discussion Summary\n\nDiego opened by sharing that the Threshold team has been making solid progress on their warehouse automation pilot with the logistics partner in Phoenix. Unit economics are tracking ahead of projections from Q4.\n\nAmara asked about timeline for the Series B. Diego confirmed they're planning to kick off the process in late Q3, likely September. The founding team wants to close before year-end to maintain momentum heading into 2027.\n\nRegarding round size, Diego mentioned they're targeting $18M for the Series B. He noted this gives them 24 months of runway at projected burn, with room to expand the engineering team and launch two additional pilot sites.\n\nAmara flagged that [Marcus Reid](people/marcus-reid) had previously expressed interest in co-investing if Halfway leads. Diego said he'd welcome that—Marcus has strong logistics connections that could help with enterprise sales.\n\nThey briefly discussed valuation expectations. Diego indicated the founders are hoping for something in the $70-80M pre-money range based on comparable deals, but acknowledged the market has cooled since last summer.\n\n## Decisions\n\n- Halfway will plan to participate in Series B diligence starting late August\n- Diego to send updated metrics deck by end of April\n\n## Action Items\n\n- [ ] **Diego**: Share Q1 pilot performance data and updated financials\n- [ ] **Diego**: Intro call between Amara and Threshold CEO [Jordan Park](people/jordan-park) in early May\n- [ ] **Amara**: Loop in Marcus Reid on potential co-investment opportunity\n- [ ] **Amara**: Review Threshold's current cap table before next sync\n\nNext check-in tentatively scheduled for mid-May.","time":null,"events":[{"id":"m2-meeting","day":"2026-04-15","kind":"meeting","keywords":["Diego","Threshold"],"basis":"the planning call itself"},{"id":"m2-d1","day":"2026-04-15","kind":"decision","keywords":["diligence"],"basis":"Decisions: Halfway will plan to participate in Series B diligence starting late August"},{"id":"m2-d2","day":"2026-04-15","kind":"decision","keywords":["deck"],"basis":"Decisions: Diego to send updated metrics deck by end of April (decided on the call; the sending itself is later)"}]},{"slug":"meetings/mtg-0003","class":"meeting","page_date":"2026-04-16","content":"---\nid: mtg-0003\ndate: 2026-04-16\nattendees: [user/amara-okafor, people/marcus-reid]\nsource: granola\nlinked_calendar: cal/evt-0008\n---\n# Deep Dive: Solaris Grid Storage Series A\n\n[Amara Okafor](user/amara-okafor) and [Marcus Reid](people/marcus-reid) discussed the Solaris Grid Storage opportunity. Marcus came prepared with updated materials following initial screening.\n\n## Company Overview\n\nMarcus walked through Solaris's positioning in the long-duration energy storage market. Team has deep experience from Tesla Energy and Fluence. Currently deploying iron-air battery systems with 100+ hour discharge capability.\n\n## Amara's Diligence Questions\n\nAmara asked Marcus to walk through the unit economics stack in detail — wanted to understand $/kWh installed cost breakdown across cells, BOS, and installation labor. Marcus noted they're targeting $25/kWh at scale vs. current $42/kWh.\n\nAmara followed up on LCOE trajectory — specifically how they're modeling degradation curves over the 25-year asset life and what assumptions drive the $0.05/kWh levelized figure. Marcus to get more granular data from the team.\n\nAmara pressed on offtake structure: \"What's the contract mix between utility PPAs, merchant exposure, and behind-the-meter? I want to understand revenue certainty in year one versus year five.\" Marcus confirmed 60% contracted via 15-year PPAs with two California IOUs.\n\nFurther question on capacity factors — Amara wanted to know realized vs. nameplate across their three pilot installations and how seasonal variation affects revenue recognition. Marcus acknowledged the Arizona site underperformed at 78% vs. 85% modeled.\n\nFinally, Amara asked about interconnection queue position and timeline risk for the 2027 pipeline.\n\n## Decisions\n\n- Solaris moves to full diligence; Amara will lead\n- Marcus to schedule technical deep-dive with CTO for next week\n\n## Action Items\n\n- [ ] Marcus: Request detailed LCOE model with degradation assumptions\n- [ ] Marcus: Get monthly capacity factor data from all three pilot sites\n- [ ] Amara: Reach out to [Priya Patel](people/priya-patel) for IOU procurement contact reference\n- [ ] Marcus: Compile interconnection queue analysis for 2027 projects","time":null,"events":[{"id":"m3-meeting","day":"2026-04-16","kind":"meeting","keywords":["Marcus","Solaris"],"basis":"the deep dive itself"},{"id":"m3-d1","day":"2026-04-16","kind":"decision","keywords":["diligence"],"basis":"Decisions: Solaris moves to full diligence; Amara will lead"},{"id":"m3-d2","day":"2026-04-16","kind":"decision","keywords":["CTO","deep-dive","deep dive"],"basis":"Decisions: Marcus to schedule technical deep-dive with CTO for next week (decided on the call)"}]},{"slug":"meetings/mtg-0004","class":"meeting","page_date":"2026-04-17","content":"---\nid: mtg-0004\ndate: 2026-04-17\nattendees: [user/amara-okafor, people/elena-rossi]\nsource: circleback\nlinked_calendar: cal/evt-0012\n---\n# Catch-up with Elena Rossi - Portfolio Strategy Discussion\n\n[Amara Okafor](user/amara-okafor) connected with [Elena Rossi](people/elena-rossi) for their quarterly check-in to discuss portfolio performance and potential co-investment opportunities.\n\n**Portfolio Updates**\n\n[Elena](people/elena-rossi) shared that [Lumina Health](companies/lumina-health) closed their Series B last month at a $180M valuation. Strong traction in the enterprise segment, now at 47 customers. [Amara](user/amara-okafor) noted that [Halfway Capital](companies/halfway-capital) had passed on the A round but would be interested in exploring secondary opportunities if any arise.\n\nDiscussion of the current climate for healthtech exits. [Elena](people/elena-rossi) mentioned that two of her portfolio companies are in early acquisition discussions, though nothing concrete yet.\n\n**Co-Investment Opportunity**\n\n[Elena](people/elena-rossi) flagged a potential deal she's leading: [Terraform Robotics](companies/terraform-robotics), a construction automation startup out of Munich. Pre-Series A, looking to raise $8-10M. Founding team includes two former Boston Dynamics engineers.\n\n[Amara](user/amara-okafor) expressed interest and asked about the competitive landscape and current revenue. [Elena](people/elena-rossi) confirmed they're pre-revenue but have three signed LOIs with major European construction firms. [Amara](user/amara-okafor) mentioned that [Marcus Reid](people/marcus-reid) has been looking at adjacent spaces and might have relevant diligence.\n\n**Other Business**\n\nBrief discussion of the upcoming [Latitude Summit](events/latitude-summit-2026) in Lisbon. Both confirmed attendance. [Elena](people/elena-rossi) offered to intro [Amara](user/amara-okafor) to a few LPs she's meeting there.\n\n**Action Items**\n- [Elena](people/elena-rossi) to send [Terraform Robotics](companies/terraform-robotics) deck and data room access by EOW\n- [Amara](user/amara-okafor) to loop in [Marcus Reid](people/marcus-reid) for initial review\n- [Amara](user/amara-okafor) to share [Halfway Capital](companies/halfway-capital) Q1 thesis update with [Elena](people/elena-rossi)\n- Schedule follow-up call for early May to discuss [Terraform](companies/terraform-robotics) findings","time":null,"events":[{"id":"m4-meeting","day":"2026-04-17","kind":"meeting","keywords":["Elena","check-in","Terraform"],"basis":"the quarterly check-in itself"}]},{"slug":"meetings/mtg-0005","class":"meeting","page_date":"2026-04-18","content":"---\nid: mtg-0005\ndate: 2026-04-18\nattendees: [user/amara-okafor, people/priya-patel]\nsource: granola\nlinked_calendar: cal/evt-0016\n---\n# Portfolio Review: CarbonLoop Q1 Performance\n\n[Priya Patel](people/priya-patel) walked through the quarterly numbers for [CarbonLoop](companies/carbonloop) and overall the trajectory looks solid.\n\n## Key Metrics Discussion\n\nRevenue came in at $2.1M for Q1, which is ahead of the $1.8M they projected in January. [Priya](people/priya-patel) noted the enterprise pipeline is stronger than expected, with three Fortune 500 pilots converting to paid contracts.\n\nOn the unit economics side, she confirmed the burn multiple is sitting at 1.8 right now, which is honestly better than I expected given they're still in growth mode. That's down from where they were six months ago, so the efficiency improvements [Marcus Reid](people/marcus-reid) pushed for are clearly showing up in the numbers.\n\n## Concerns Flagged\n\n[Priya](people/priya-patel) raised some concerns about their engineering hiring pace. They've only filled 2 of the 5 senior roles they opened in Q4. Competitive market for climate tech engineers apparently. She's going to connect them with a few recruiting firms that have worked well for other portfolio companies.\n\nAlso discussed the regulatory landscape briefly—the new EPA guidelines coming in July could actually be a tailwind for them if they position correctly.\n\n## Decisions\n\n- Approved the bridge extension terms we discussed last month\n- Green-lit the Series B prep timeline for Q3\n- Agreed to hold off on board observer seat until after next funding round\n\n## Action Items\n\n- [Priya](people/priya-patel) to send intro to recruiting firms by EOW\n- [Amara](user/amara-okafor) to review updated board deck before May meeting\n- Schedule follow-up with [CarbonLoop](companies/carbonloop) CEO in 3 weeks to check on hiring progress\n- [Priya](people/priya-patel) to draft Series B positioning memo","time":null,"events":[{"id":"m5-meeting","day":"2026-04-18","kind":"meeting","keywords":["Priya","CarbonLoop"],"basis":"the portfolio review itself"},{"id":"m5-d1","day":"2026-04-18","kind":"decision","keywords":["bridge"],"basis":"Decisions: approved the bridge extension terms"},{"id":"m5-d2","day":"2026-04-18","kind":"decision","keywords":["Series B"],"basis":"Decisions: green-lit the Series B prep timeline for Q3"},{"id":"m5-d3","day":"2026-04-18","kind":"decision","keywords":["observer"],"basis":"Decisions: agreed to hold off on board observer seat until after next funding round"}]},{"slug":"meetings/mtg-0006","class":"meeting","page_date":"2026-04-18","content":"---\nid: mtg-0006\ndate: 2026-04-18\nattendees: [user/amara-okafor, people/kofi-mensah]\nsource: circleback\n---\n# Helios Energy Board Seat \u0026 Portfolio Review\n\n[Kofi Mensah](people/kofi-mensah) and [Amara Okafor](user/amara-okafor) connected to discuss the [Helios Energy](companies/helios-energy) investment and upcoming board changes.\n\n## Helios Board Transition\n\nKofi confirmed that the [Helios Energy](companies/helios-energy) board formally approved the new director appointment at yesterday's meeting. Amara takes the Helios board seat effective May 1st, replacing the outgoing independent director who's stepping down after three years.\n\nKofi mentioned the timing works well since they're entering a critical phase with the Series C preparation. He wants someone from [Halfway Capital](companies/halfway-capital) who understands the operational challenges they've been navigating with the supply chain issues.\n\nAmara noted she's already familiar with the team from the diligence process and has been tracking their metrics closely. She'll plan to attend the May 15th board meeting in person in Austin.\n\n## Portfolio Updates\n\nQuick rundown on other portfolio companies:\n\n- [Meridian Labs](companies/meridian-labs) - Q1 numbers came in strong, 40% above forecast\n- [Nomad Health](companies/nomad-health) - Still working through the regulatory approval, expecting clarity by end of Q2\n- [Priya Patel](people/priya-patel) flagged some concerns about burn rate at one of the earlier-stage companies, will sync separately\n\n## Action Items\n\n- [ ] Amara to complete board onboarding paperwork by April 25th\n- [ ] Kofi to send over the updated cap table and most recent board deck\n- [ ] Schedule intro call with [Helios Energy](companies/helios-energy) CFO before May board meeting\n- [ ] Amara to review D\u0026O insurance coverage requirements\n\nKofi mentioned grabbing coffee with [Marcus Reid](people/marcus-reid) next week to discuss potential co-investment opportunities. Amara asked him to loop her in if anything looks promising in the climate tech space.","time":null,"events":[{"id":"m6-meeting","day":"2026-04-18","kind":"meeting","keywords":["Kofi","Helios"],"basis":"the board-seat and portfolio review meeting itself"},{"id":"m6-p1","day":"2026-04-17","kind":"decision","keywords":["director","approv"],"basis":"Kofi confirmed the Helios board formally approved the new director appointment at yesterday's meeting (the day before 2026-04-18)"}]},{"slug":"meetings/mtg-0007","class":"meeting","page_date":"2026-04-19","content":"---\nid: mtg-0007\ndate: 2026-04-19\nattendees: [user/amara-okafor, people/elena-rossi]\nsource: granola\n---\n# Portfolio Review: Codex Robotics Q1 Performance\n\n[Amara Okafor](user/amara-okafor) and [Elena Rossi](people/elena-rossi) connected to review Q1 2026 performance for [Codex Robotics](companies/codex-robotics), one of Halfway Capital's Series A investments from late 2024.\n\n**Key Metrics Discussion**\n\nElena walked through the numbers. ARR grew 34% quarter-over-quarter, now sitting at $2.8M. Net revenue retention came in at 118%, which Amara noted was strong for their stage. Customer count increased from 23 to 31 enterprise accounts, with the manufacturing vertical showing particular traction.\n\nBurn rate has increased but remains within acceptable bounds—$420K/month versus the $380K projected. Elena explained the overage was due to accelerating the robotics engineering hire plan by one quarter.\n\n**Concerns Raised**\n\nAmara flagged that the sales cycle has lengthened from an average of 68 days to 89 days. Elena acknowledged this and attributed it to moving upmarket into larger enterprise deals. They agreed this needs monitoring but isn't necessarily negative if deal sizes scale proportionally.\n\nDiscussion around the competitive landscape—[Elena Rossi](people/elena-rossi) mentioned that a well-funded competitor out of Munich has started targeting the same manufacturing segment. Codex's technical differentiation on adaptive learning remains strong, but go-to-market execution will matter more in the next two quarters.\n\n**Decisions**\n\n- Halfway Capital will participate in the upcoming bridge round, maintaining pro-rata\n- Board seat observation rights to continue with Amara attending Q2 board meeting in person (scheduled May 15th)\n\n**Action Items**\n\n- [Elena Rossi](people/elena-rossi) to send updated cap table and bridge round terms by April 25th\n- [Amara Okafor](user/amara-okafor) to connect Elena with [Marcus Reid](people/marcus-reid) for potential customer intro in the logistics space\n- Elena to provide competitive analysis memo before next board meeting\n\nNext check-in scheduled for early May ahead of the board meeting.","time":null,"events":[{"id":"m7-meeting","day":"2026-04-19","kind":"meeting","keywords":["Elena","Codex"],"basis":"the portfolio review itself"},{"id":"m7-d1","day":"2026-04-19","kind":"decision","keywords":["bridge","pro-rata","pro rata"],"basis":"Decisions: Halfway will participate in the upcoming bridge round, maintaining pro-rata"},{"id":"m7-d2","day":"2026-04-19","kind":"decision","keywords":["observ"],"basis":"Decisions: board seat observation rights continue, with Amara attending the Q2 board meeting in person (decided on 2026-04-19; the board meeting itself is May 15)"}]},{"slug":"cal/evt-0000","class":"calendar","page_date":"2026-04-14","content":"---\ntitle: \"Elena sync\"\ntype: calendar-event\ndate: 2026-04-14\nstart: 2026-04-14T01:00:00Z\nend: 2026-04-14T01:30:00Z\nattendees: [user/amara-okafor, people/elena-rossi]\n---\nCalendar invite: Elena sync, 2026-04-14 01:00 to 01:30 UTC, with Amara Okafor and Elena Rossi.\n","time":{"raw":"20260414T010000Z","utc_day":"2026-04-14","pacific":"04/13/2026 18:00"},"events":[{"id":"evt-0000-meeting","day":"2026-04-14","kind":"meeting","keywords":["Elena","sync"],"basis":"the invite's own meeting on its DTSTART day (UTC)"}]},{"slug":"cal/evt-0001","class":"calendar","page_date":"2026-04-14","content":"---\ntitle: \"Priya sync\"\ntype: calendar-event\ndate: 2026-04-14\nstart: 2026-04-14T03:00:00Z\nend: 2026-04-14T03:30:00Z\nattendees: [user/amara-okafor, people/priya-patel]\nlocation: \"Halfway HQ\"\n---\nCalendar invite: Priya sync, 2026-04-14 03:00 to 03:30 UTC, with Amara Okafor and Priya Patel. Location: Halfway HQ.\n","time":{"raw":"20260414T030000Z","utc_day":"2026-04-14","pacific":"04/13/2026 20:00"},"events":[{"id":"evt-0001-meeting","day":"2026-04-14","kind":"meeting","keywords":["Priya","sync"],"basis":"the invite's own meeting on its DTSTART day (UTC)"}]},{"slug":"cal/evt-0002","class":"calendar","page_date":"2026-04-14","content":"---\ntitle: \"Hannah sync\"\ntype: calendar-event\ndate: 2026-04-14\nstart: 2026-04-14T05:00:00Z\nend: 2026-04-14T05:30:00Z\nattendees: [user/amara-okafor, people/hannah-liu]\n---\nCalendar invite: Hannah sync, 2026-04-14 05:00 to 05:30 UTC, with Amara Okafor and Hannah Liu.\n","time":{"raw":"20260414T050000Z","utc_day":"2026-04-14","pacific":"04/13/2026 22:00"},"events":[{"id":"evt-0002-meeting","day":"2026-04-14"," <script>
const DATA = JSON.parse(document.getElementById('packet-data').textContent);
const SHA = document.getElementById('packet-data').dataset.sha;
const KEY = 'w11:' + DATA.packet + ':' + SHA;
const el = (tag, attrs = {}, ...kids) => { const n = document.createElement(tag); for (const [k, v] of Object.entries(attrs)) { if (k === 'text') n.textContent = v; else if (k.startsWith('on')) n.addEventListener(k.slice(2), v); else n.setAttribute(k, v); } for (const c of kids) if (c != null) n.append(c); return n; };
let state = { reviewer: '', answers: {}, extras: {}, rule_disagreement: '', submitted: false };
let saveStatus = 'not saved yet';
let current = 0;
function keepPlace(fn) { const y = window.scrollY; fn(); window.scrollTo(0, y); }
function load() { try { const s = localStorage.getItem(KEY); if (s) state = Object.assign(state, JSON.parse(s)); saveStatus = s ? 'restored from this computer' : saveStatus; } catch (e) { saveStatus = 'this browser blocks saving: export before closing'; } }
function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); saveStatus = 'saved on this computer'; } catch (e) { saveStatus = 'could not save on this computer (' + e.name + '): export before closing'; } renderStatus(); }
function exportObject() { return { schema: 'w11-labels/1', packet: DATA.packet, packet_sha256: SHA, label_files: DATA.label_files, seed: DATA.seed ?? null, reviewer: state.reviewer, exported_at: new Date().toISOString(), submitted: state.submitted, rule_disagreement: state.rule_disagreement, answers: state.answers, extras: state.extras }; }
async function doExport() {
  const text = JSON.stringify(exportObject(), null, 2);
  const name = 'w11-labels-' + DATA.packet + '-' + new Date().toISOString().slice(0, 10) + '.json';
  let msg = [];
  try { const a = el('a', { href: URL.createObjectURL(new Blob([text], { type: 'application/json' })), download: name }); document.body.append(a); a.click(); a.remove(); msg.push('downloaded ' + name); } catch (e) { msg.push('download failed (' + e.name + ')'); }
  try { await navigator.clipboard.writeText(text); msg.push('copied to the clipboard'); } catch (e) { msg.push('clipboard unavailable: copy from the box below'); showPlain(text); }
  saveStatus = 'exported, not yet received (' + msg.join('; ') + '). Paste or attach it in the Capy thread.'; renderStatus();
}
function showPlain(text) { const box = document.getElementById('plain'); box.classList.remove('hidden'); box.querySelector('textarea').value = text; }
function doImport(file) {
  file.text().then(t => {
    let obj; try { obj = JSON.parse(t); } catch (e) { alert('That file is not JSON.'); return; }
    if (obj.schema !== 'w11-labels/1' || obj.packet !== DATA.packet) { alert('That export belongs to another packet.'); return; }
    if (obj.packet_sha256 !== SHA) { alert('That export was made from a different version of this packet; it was not imported.'); return; }
    for (const [path, h] of Object.entries(DATA.label_files)) if ((obj.label_files || {})[path] !== h) { alert('Label file hash mismatch for ' + path + '; not imported.'); return; }
    if (typeof obj.answers !== 'object' || obj.answers === null) { alert('No answers in that file.'); return; }
    state = { reviewer: String(obj.reviewer || ''), answers: obj.answers, extras: obj.extras || {}, rule_disagreement: String(obj.rule_disagreement || ''), submitted: !!obj.submitted };
    save(); render();
  });
}
function renderStatus() { const s = document.getElementById('status'); if (s) s.textContent = saveStatus; const p = document.getElementById('progress'); if (p) p.textContent = progressText(); }
function header(intro) {
  const h = el('header', {},
    el('span', { class: 'progress', id: 'progress' }),
    el('label', {}, 'Your name ', el('input', { value: state.reviewer, oninput: e => { state.reviewer = e.target.value; save(); }, 'aria-label': 'Reviewer name' })),
    el('button', { onclick: doExport, title: 'Download a JSON file and copy it to the clipboard' }, 'Export answers'),
    el('label', { class: 'chip' }, 'Import answers ', el('input', { type: 'file', accept: 'application/json', onchange: e => e.target.files[0] && doImport(e.target.files[0]) })),
    el('button', { onclick: submitSection }, state.submitted ? 'Submitted' : 'Submit this section'),
    el('span', { class: 'status muted', id: 'status' }));
  return h;
}
function submitSection() {
  if (state.submitted) return;
  const s = summary();
  if (!confirm('Submit this section?\n\n' + s + '\n\nSubmitted answers lock; a later change becomes a dated amendment. Export afterwards and paste the file into the Capy thread.')) return;
  state.submitted = true; save(); render();
}
document.addEventListener('keydown', e => {
  if (e.target.matches('input,textarea')) return;
  const cards = [...document.querySelectorAll('.card[data-id]')]; if (!cards.length) return;
  let i = Math.min(current, cards.length - 1);
  if (e.key === 'j' || e.key === 'k') { cards[i].classList.remove('current'); i = Math.max(0, Math.min(cards.length - 1, i + (e.key === 'j' ? 1 : -1))); current = i; cards[i].classList.add('current'); cards[i].scrollIntoView({ block: 'start' }); cards[i].querySelector('input')?.focus(); e.preventDefault(); return; }
  const map = { '1': 0, '2': 1, '3': 2, 'n': 3 }; if (!(e.key in map)) return;
  const groups = [...cards[i].querySelectorAll('[role=radiogroup]')];
  const target = groups.find(g => ![...g.querySelectorAll('input')].some(x => x.checked)) || groups[0];
  const radios = target ? [...target.querySelectorAll('input[type=radio]:not(:disabled)')] : [];
  const r = radios[map[e.key]]; if (r) { r.click(); e.preventDefault(); }
});

const OUTCOMES = [['supported', 'Supported as written'], ['error', 'Has an error'], ['cant_tell', "Can't tell"]];
const ERRORS = [['date', 'date'], ['description', 'description or person'], ['not_event', 'not an event'], ['keywords', "keywords wouldn't identify it"]];
const events = DATA.cards.flatMap(c => c.events.map(e => e.id));
function answered(id) { const a = state.answers[id]; if (!a || !a.outcome) return false; if (a.outcome === 'error') { const errs = a.errors || []; if (!errs.length) return false; if (errs.includes('date') && !/^\d{4}-\d{2}-\d{2}$/.test(a.corrected_day || '')) return false; } return true; }
function progressText() { const n = events.filter(answered).length; const pages = DATA.cards.filter(c => c.events.every(e => answered(e.id))).length; return 'Chronicle ' + pages + '/' + DATA.cards.length + ' pages \u00B7 ' + n + '/' + events.length + ' events'; }
function summary() { const vals = events.map(id => state.answers[id]?.outcome); const added = Object.values(state.extras).flat().length; return 'Answered ' + events.filter(answered).length + ' of ' + events.length + ' (supported ' + vals.filter(v => v === 'supported').length + ', with an error ' + vals.filter(v => v === 'error').length + ", can't tell " + vals.filter(v => v === 'cant_tell').length + '); unanswered ' + events.filter(id => !answered(id)).length + '; missed events added ' + added + '.'; }
function eventBlock(card, ev) {
  const a = state.answers[ev.id] || (state.answers[ev.id] = {});
  const lock = state.submitted;
  const fields = el('div', { class: 'fields' + (a.outcome === 'error' ? '' : ' hidden') });
  for (const [k, label] of ERRORS) fields.append(el('label', {}, Object.assign(el('input', { type: 'checkbox', onchange: e => { a.errors = (a.errors || []).filter(x => x !== k).concat(e.target.checked ? [k] : []); save(); render(); } }), { checked: (a.errors || []).includes(k), disabled: lock }), ' ' + label));
  if ((a.errors || []).includes('date')) fields.append(el('label', {}, 'Correct UTC day (required) ', Object.assign(el('input', { type: 'date', oninput: e => { a.corrected_day = e.target.value; save(); } }), { value: a.corrected_day || '', disabled: lock })));
  if ((a.errors || []).some(x => x === 'description' || x === 'keywords')) {
    fields.append(el('label', {}, 'Correct description ', Object.assign(el('input', { oninput: e => { a.corrected_description = e.target.value; save(); } }), { value: a.corrected_description || '', disabled: lock })));
