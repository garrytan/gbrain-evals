<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 440" width="920" height="440" role="img" aria-label="Paired latency ratio per operation" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
