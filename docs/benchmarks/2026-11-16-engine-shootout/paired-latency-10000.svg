<text x="24" y="32" font-size="20" fill="#e5e7eb" text-anchor="start" font-weight="700">PGLite time as a multiple of Postgres + pgvector time</text>
<text x="24" y="54" font-size="12" fill="#9ca3af" text-anchor="start" font-weight="400">Same query on both engines, back to back, random order, 10,000 pages. Dot is the geometric mean ratio, bar is the 95% interval.</text>
<text x="24" y="72" font-size="12" fill="#9ca3af" text-anchor="start" font-weight="400">Left of the 1x line, PGLite is faster. The 2x line is the preregistered margin.</text>
