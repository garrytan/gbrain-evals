<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 470" width="920" height="470" role="img" aria-label="Import, startup and footprint" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<rect width="920" height="470" fill="#0a0a0a"/>
<text x="24" y="32" font-size="20" fill="#e5e7eb" text-anchor="start" font-weight="700">Import, cold start, memory and disk, 1,000 pages</text>
<text x="24" y="52" font-size="12" fill="#9ca3af" text-anchor="start" font-weight="400">One measured run per engine, so no interval. Each row has its own scale.</text>
<rect x="24" y="66" width="10" height="10" rx="2" fill="#16a34a"/>
<text x="40" y="76" font-size="12" fill="#e5e7eb" text-anchor="start" font-weight="400">Postgres + pgvector</text>
<rect x="194" y="66" width="10" height="10" rx="2" fill="#38bdf8"/>
<text x="210" y="76" font-size="12" fill="#e5e7eb" text-anchor="start" font-weight="400">PGLite</text>
<text x="24" y="110" font-size="12" fill="#e5e7eb" text-anchor="start" font-weight="400">Bulk import of 1,000 pages, pages/s (higher is better)</text>
<rect x="420" y="96" width="360" height="16" rx="2" fill="#16a34a"/>
<text x="788" y="109" font-size="12" fill="#e5e7eb" text-anchor="start" font-weight="400">67.5</text>
<rect x="420" y="118" width="277.7009547418418" height="16" rx="2" fill="#38bdf8"/>
<text x="705.7009547418418" y="131" font-size="12" fill="#e5e7eb" text-anchor="start" font-weight="400">52.1</text>
<text x="24" y="176" font-size="12" fill="#e5e7eb" text-anchor="start" font-weight="400">Chunk upserts during import, chunks/s (higher is better)</text>
<rect x="420" y="162" width="360" height="16" rx="2" fill="#16a34a"/>
<text x="788" y="175" font-size="12" fill="#e5e7eb" text-anchor="start" font-weight="400">264</text>
<rect x="420" y="184" width="217.7434985406611" height="16" rx="2" fill="#38bdf8"/>
<text x="645.7434985406611" y="197" font-size="12" fill="#e5e7eb" text-anchor="start" font-weight="400">160</text>
<text x="24" y="242" font-size="12" fill="#e5e7eb" text-anchor="start" font-weight="400">Cold start to first answer, ms (lower is better)</text>
<rect x="420" y="228" width="205.37181130282198" height="16" rx="2" fill="#16a34a"/>
<text x="633.3718113028219" y="241" font-size="12" fill="#e5e7eb" text-anchor="start" font-weight="400">457</text>
<rect x="420" y="250" width="360.00000000000006" height="16" rx="2" fill="#38bdf8"/>
<text x="788" y="263" font-size="12" fill="#e5e7eb" text-anchor="start" font-weight="400">801</text>
<text x="24" y="308" font-size="12" fill="#e5e7eb" text-anchor="start" font-weight="400">Peak memory (engine plus server), MB (lower is better)</text>
<rect x="420" y="294" width="42.475382170301316" height="16" rx="2" fill="#16a34a"/>
<text x="470.4753821703013" y="307" font-size="12" fill="#e5e7eb" text-anchor="start" font-weight="400">253</text>
<rect x="420" y="316" width="360" height="16" rx="2" fill="#38bdf8"/>
<text x="788" y="329" font-size="12" fill="#e5e7eb" text-anchor="start" font-weight="400">2,146</text>
<text x="24" y="374" font-size="12" fill="#e5e7eb" text-anchor="start" font-weight="400">On-disk size, no WAL, MB (lower is better)</text>
<rect x="420" y="360" width="360" height="16" rx="2" fill="#16a34a"/>
<text x="788" y="373" font-size="12" fill="#e5e7eb" text-anchor="start" font-weight="400">86.3</text>
<rect x="420" y="382" width="358.33018960740486" height="16" rx="2" fill="#38bdf8"/>
<text x="786.3301896074049" y="395" font-size="12" fill="#e5e7eb" text-anchor="start" font-weight="400">85.9</text>
<text x="24" y="456" font-size="11" fill="#9ca3af" text-anchor="start" font-weight="400">Memory and disk definitions are in the report. Cold start has a warm OS file cache.</text>
</svg>
