# The extract-first recipe stack with read_route.py, which wraps the bundle's shim.py, as the shim: searches embed through
# the metering slot's read route (<slot>~read). The cost-and-speed experiment runs it
# (docs/benchmarks/2026-11-24-cost-speed-preregistration.md); every other cell runs the bundle's stack one directory up.
#
#   bash eval/systems/bootstrap.sh up --system ext-extract-first --config read-route
#
# As in the bundle's stack, the only container with a route out is `proxy`, a TCP relay to the metering proxy; the
# shim holds a dummy key and the proxy injects the real one. The harness reaches the shim at 127.0.0.1:${SHIM_HOST_PORT:-8702}.
name: shootout-ext-extract-first-read-route

services:
  shim:
    build:
      context: ../../../..
      dockerfile: docs/comparison-systems/ext-extract-first/read-route/Dockerfile
    image: shootout/ext-extract-first:read-route
    depends_on:
      qdrant:
        condition: service_healthy
    environment:
      SHIM_CONFIG: recipe
      SHIM_IMAGE: ${SHIM_IMAGE:-}
      MEM0_CHUNK_TURNS: ${MEM0_CHUNK_TURNS:-2}
      OPENAI_API_KEY: ${SHOOTOUT_CELL_TOKEN:-sk-dummy-metering-proxy-injects-the-real-key}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-${PROXY_URL:-http://proxy:8787}/${PROXY_SLOT:-ext-extract-first}/openai/v1}
    volumes:
      - data:/data
    networks: [sandbox]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,json,sys; sys.exit(0 if json.load(urllib.request.urlopen('http://127.0.0.1:8700/health'))['ok'] else 1)"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 20s

  qdrant:
    image: qdrant/qdrant:v1.19.2@sha256:b7b0444c4c351c970b98e90a6f89c2ee4287c65b44e52b4cb503fa5b2aa927ad
    environment:
      QDRANT__TELEMETRY_DISABLED: "true"
    volumes:
      - qdrant:/qdrant/storage
    networks: [sandbox]
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 3s
      retries: 20

  proxy:
    image: alpine/socat:1.8.0.3@sha256:beb4a68d9e4fe6b0f21ea774a0fde6c31f580dde6368939ed70100c5385b015e
    command: ["TCP-LISTEN:8787,fork,reuseaddr", "TCP:${PROXY_UPSTREAM:-host.docker.internal:8787}"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    networks: [sandbox, egress]

  # Publishes the shim's port to the host without giving the shim itself a route out.
  ingress:
    image: alpine/socat:1.8.0.3@sha256:beb4a68d9e4fe6b0f21ea774a0fde6c31f580dde6368939ed70100c5385b015e
    command: ["TCP-LISTEN:8700,fork,reuseaddr", "TCP:shim:8700"]
    ports: ["127.0.0.1:${SHIM_HOST_PORT:-8702}:8700"]
    networks: [sandbox, egress]

networks:
  sandbox:
    internal: true
  egress: {}

volumes:
  data: {}
  qdrant: {}
