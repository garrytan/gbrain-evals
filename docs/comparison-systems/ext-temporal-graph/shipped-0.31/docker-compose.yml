# Graphiti (graphiti-core 0.31.2 with its shipped defaults, not Zep Cloud) on Neo4j 5.26 behind the shootout shim
# (eval/systems/PROTOCOL.md). bootstrap.sh uses this file for --config shipped-0.31; recipe and common use ../docker-compose.yml.
#
#   SHIM_CONFIG=shipped-0.31  PROXY_URL=http://<metering proxy host:port>  docker compose up -d --build
#
# The network layout is the pinned bundle's: every vendor container sits on `internal`, a Docker network with no route
# out, and the `egress` relay is the only container on both networks. OPENAI_BASE_URL points at
# http://egress:9000${PROXY_OPENAI_PATH}; graphiti-core's default clients read it (and the dummy key) from the
# environment, so a provider call can only reach the proxy. EMBEDDING_DIM is deliberately unset (default 1024).
# A separate project name keeps this stack's volumes apart from the 0.30.2 stack's.
name: shootout-graphiti-shipped-031

services:
  neo4j:
    image: neo4j:5.26.2@sha256:099b9f74968c123209972835417985ed2a1cc19c0422c0753a313e26a736c365
    environment:
      NEO4J_AUTH: neo4j/shootout-graphiti
      NEO4J_server_memory_heap_max__size: 2G
      NEO4J_server_memory_pagecache_size: 1G
      NEO4J_dbms_usage__report_enabled: "false"
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p shootout-graphiti 'RETURN 1' >/dev/null 2>&1"]
      interval: 3s
      retries: 60
    networks: [internal]

  shim:
    build: { context: ../../../.., dockerfile: docs/comparison-systems/ext-temporal-graph/shipped-0.31/Dockerfile }
    environment:
      SHIM_CONFIG: ${SHIM_CONFIG:-shipped-0.31}
      SHIM_GRANULARITY: ${SHIM_GRANULARITY:-session}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: shootout-graphiti
      OPENAI_BASE_URL: http://egress:9000${PROXY_OPENAI_PATH:-/openai/v1}
      OPENAI_API_KEY: ${SHOOTOUT_CELL_TOKEN:-dummy-key-the-proxy-injects-the-real-one}
      GRAPHITI_TELEMETRY_ENABLED: "false"
    depends_on:
      neo4j: { condition: service_healthy }
    networks: [internal]

  egress:
    image: alpine/socat@sha256:82ad20f6f6e29b91ff33b6662d24063522b1378f08fd8569cd3ab412cac13f50
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        upstream=$${PROXY_URL#*://}; upstream=$${upstream%%/*}
        socat TCP-LISTEN:8700,fork,reuseaddr TCP:shim:8700 &
        exec socat TCP-LISTEN:9000,fork,reuseaddr TCP:$$upstream
    environment:
      PROXY_URL: ${PROXY_URL:-http://host.docker.internal:8787}
    extra_hosts: ["host.docker.internal:host-gateway"]
    ports: ["127.0.0.1:${SHIM_HOST_PORT:-8700}:8700"]
    networks: [internal, outside]

networks:
  internal: { internal: true }
  outside: {}

volumes:
  neo4j-data: {}
  neo4j-logs: {}
