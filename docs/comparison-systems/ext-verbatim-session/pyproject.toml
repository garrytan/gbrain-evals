[project]
name = "shootout-mempalace-shim"
version = "0.0.0"
requires-python = "==3.12.*"
dependencies = ["mempalace==3.10.0"]

[tool.uv]
package = false
exclude-newer = "2026-10-06T00:00:00Z"
# Every transitive dependency is held to the version in mempalace's own uv.lock at tag v3.10.0
# (commit 22fd87f09c19d5ffb2d6966486483353937931c0), resolved for CPython 3.12 on Linux, so the image runs the set
# the vendor tested. Pins for optional extras (gpu, milvus, pgvector, dev) apply only if something installs them.
